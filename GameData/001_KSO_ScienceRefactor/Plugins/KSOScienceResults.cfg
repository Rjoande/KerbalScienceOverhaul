// Settings for the KSOScienceResults plugin (science result selection).
// Read at database load, so ModuleManager patches apply, e.g.:
//   @KSO_RESULTS_SETTINGS:FINAL { @fallbackChance = 0.2 }
KSO_RESULTS_SETTINGS
{
	// false: stock result selection (every matching key in one pool).
	enabled = true

	// 0..1. Starting from the most specific group of matching keys, the
	// chance of stepping down to the next, less specific group; rolled
	// again at every step, down to the "default" entries. 0 = always the
	// most specific group. 0.2 gives roughly 80% biome, 16% next group,
	// 3% the one after that.
	fallbackChance = 0

	// true: log every selection (subject, groups, chosen key) to KSP.log.
	debugLog = false
}
